services:

  app:

    build:
      context: .
      dockerfile: docker/Dockerfile

    container_name: intellexa_app

    ports:
      - "8080:8080"

    env_file:
      - .env

    depends_on:
      - qdrant

  qdrant:

    image: qdrant/qdrant:latest

    container_name: qdrant_container

    ports:
      - "6333:6333"

    volumes:
      - ./qdrant_storage:/qdrant/storage